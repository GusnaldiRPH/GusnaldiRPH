<svg fill="none" width="100%" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes typing {
          from { width: 0 }
          to { width: 100% }
        }

        @keyframes blink {
          50% { border-color: transparent }
        }

        .banner-container {
          position: relative;
          width: 100%;
          height: 200px;
          background-image: url('https://raw.githubusercontent.com/GusnaldiRPH/GusnaldiRPH/main/banner.jpg');
          background-size: cover;
          background-position: center;
          display: flex;
          align-items: center;
          justify-content: center;
          border-radius: 10px;
          color: white;
          font-family: 'Fira Code', monospace;
          font-weight: 600;
          font-size: 24px;
        }

        .typing-text {
          overflow: hidden;
          white-space: nowrap;
          letter-spacing: 0.15em;
          border-right: .15em solid orange;
          animation: 
            typing 3.5s steps(30, end),
            blink .75s step-end infinite;
          animation-iteration-count: infinite;
        }
      </style>
      <div class="banner-container">
        <div class="typing-text">Halo, Selamat Datang!</div>
      </div>
    </div>
  </foreignObject>
</svg>
